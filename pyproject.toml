[project]
name = "ml-algorithms-task2"
version = "0.1.0"
description = "Telco Customer Churn prediction pipeline - NextBridge AI/ML Internship Task"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scikit-learn==1.4.2",
    "matplotlib==3.8.4",
    "seaborn==0.13.2",
    "joblib==1.4.2",
    "scipy==1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
